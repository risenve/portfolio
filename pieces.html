<body class="museum-body">

  <!-- NAV — minimal, auto-hiding: logo + Contact -->
  <nav class="site-nav museum-nav" id="museum-nav">
    <a href="/" class="nav-logo">
      <img src="/images/logo_variants/r logo black.svg" width="28" height="28" alt="Ripsime Sargsyan">
    </a>
    <button class="museum-contact" id="nav-toggle" type="button" aria-label="Open contact menu">Contact</button>
  </nav>

  <!-- FULL OVERLAY (opens on Contact) -->
  <div class="nav-overlay" id="nav-overlay">
    <div class="overlay-header">
      <a href="/" class="nav-logo">
        <img src="/images/logo_variants/logo white without bg.svg" width="24" height="24" alt="Ripsime Sargsyan">
      </a>
      <button class="overlay-close" id="overlay-close">×</button>
    </div>
    <div class="overlay-body">
      <div>
        <div class="overlay-stair-links">
          <a href="/">Home</a>
          <a href="/work">Work</a>
          <button class="ol-service-toggle" type="button">Services <span class="ol-toggle-arrow">▾</span></button>
          <div class="ol-service-sub" id="ol-service-sub">
            <a href="/service-branding">Branding</a>
            <a href="/service-uiux">UI/UX</a>
            <a href="/service-product-design">Product Design</a>
            <a href="/service-art-direction">Art Direction</a>
          </div>
          <a href="/talks">Talks</a>
        </div>
        <div class="overlay-socials">
          <a href="https://instagram.com/ripssimee/" target="_blank" rel="noopener">Instagram</a>
          <a href="https://t.me/ripssimee" target="_blank" rel="noopener">Telegram</a>
          <a href="https://linkedin.com/in/ripsime-sargsyan/" target="_blank" rel="noopener">LinkedIn</a>
          <a href="https://behance.net/gallery/214524539/Eburet-online-store-redesign" target="_blank" rel="noopener">Behance</a>
        </div>
      </div>
      <div class="overlay-form-wrap">
        <form id="overlay-form" class="ol-form" novalidate>
          <div class="ol-field">
            <input type="text" name="ol-name" required placeholder=" ">
            <label class="ol-label">Name</label>
          </div>
          <div class="ol-field">
            <input type="email" name="ol-email" required placeholder=" ">
            <label class="ol-label">Email</label>
          </div>
          <div class="ol-field">
            <input type="text" name="ol-message" required placeholder=" ">
            <label class="ol-label">About project</label>
          </div>
          <label class="ol-consent">
            <input type="checkbox" name="ol-consent" required>
            <span class="ol-consent-text">I agree to the processing of personal data.</span>
          </label>
          <button type="submit" class="ol-submit">Send →</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ============ MUSEUM CANVAS ============ -->
  <div class="museum" id="museum">
    <div class="museum-world" id="museum-world"></div>
  </div>

  <!-- floating hover caption -->
  <div class="museum-caption" id="museum-caption"></div>

  <!-- hint -->
  <div class="museum-hint" id="museum-hint">
    <span>Drag to explore</span>
    <span class="dot"></span>
    <span>Scroll to zoom</span>
    <span class="dot hide-sm"></span>
    <span class="hide-sm">Click a piece</span>
  </div>

  <!-- iPhone-style pan pills (minimap scrollbars) -->
  <div class="mmbar mmbar-h" id="mmbar-h"><div class="mmthumb" id="mmthumb-h"></div></div>
  <div class="mmbar mmbar-v" id="mmbar-v"><div class="mmthumb" id="mmthumb-v"></div></div>

  <!-- zoom controls -->
  <div class="museum-zoom">
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <div class="museum-zoom-pct" id="museum-zoom-pct">100%</div>
  </div>

  <!-- ============ POPUP ============ -->
  <div class="pm" id="pm" role="dialog" aria-modal="true" aria-label="Piece detail">
    <button class="pm-close" id="pm-close" type="button" aria-label="Close">×</button>
    <button class="pm-nav pm-prev" id="pm-prev" type="button" aria-label="Previous">‹</button>
    <button class="pm-nav pm-next" id="pm-next" type="button" aria-label="Next">›</button>
    <div class="pm-inner">
      <div class="pm-media" id="pm-media"></div>
      <div class="pm-info">
        <h2 class="pm-title" id="pm-title"></h2>
        <p class="pm-story" id="pm-story"></p>
        <div class="pm-meta">
          <span class="pm-year" id="pm-year"></span>
          <a class="pm-link" id="pm-link" target="_blank" rel="noopener" hidden>Source ↗</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/pieces.js"></script>
